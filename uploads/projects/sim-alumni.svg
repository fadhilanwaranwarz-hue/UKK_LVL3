<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAlumni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgAlumni)"/>
  <circle cx="680" cy="100" r="160" fill="#10b981" opacity="0.2" filter="blur(60px)"/>
  <circle cx="100" cy="380" r="140" fill="#3b82f6" opacity="0.2" filter="blur(60px)"/>

  <!-- UI Mockup -->
  <rect x="120" y="60" width="560" height="380" rx="16" fill="#064e3b" stroke="#047857" stroke-width="2"/>
  <rect x="120" y="60" width="560" height="42" rx="16" fill="#022c22"/>
  <circle cx="150" cy="81" r="5" fill="#ef4444"/>
  <circle cx="168" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="186" cy="81" r="5" fill="#10b981"/>
  <text x="400" y="86" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">SIM-Alumni Stella • Tracer Study</text>

  <!-- Dashboard card stats -->
  <rect x="150" y="125" width="500" height="80" rx="12" fill="url(#emeraldGrad)"/>
  <text x="180" y="160" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold">Tracer Study &amp; Komunitas Alumni</text>
  <text x="180" y="185" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="13">Pelacakan karir, data kuliah, dan jejaring SMK Telkom</text>

  <!-- Metric badges -->
  <rect x="150" y="225" width="150" height="90" rx="10" fill="#047857"/>
  <text x="170" y="260" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12">Total Alumni</text>
  <text x="170" y="295" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">1,420+</text>

  <rect x="325" y="225" width="150" height="90" rx="10" fill="#047857"/>
  <text x="345" y="260" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12">Terserap Kerja</text>
  <text x="345" y="295" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">88.4%</text>

  <rect x="500" y="225" width="150" height="90" rx="10" fill="#047857"/>
  <text x="520" y="260" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12">Mitra Industri</text>
  <text x="520" y="295" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">64 PT</text>

  <!-- Graph line illustration -->
  <path d="M150 390 Q250 340 350 360 T550 320 T650 300" fill="none" stroke="#34d399" stroke-width="4"/>
</svg>
