<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKantin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgKantin)"/>
  <circle cx="700" cy="120" r="180" fill="#f97316" opacity="0.15" filter="blur(60px)"/>
  <circle cx="100" cy="400" r="150" fill="#06b6d4" opacity="0.15" filter="blur(60px)"/>

  <!-- UI Window Mockup -->
  <rect x="120" y="60" width="560" height="380" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="120" y="60" width="560" height="42" rx="16" fill="#0f172a"/>
  <circle cx="150" cy="81" r="5" fill="#ef4444"/>
  <circle cx="168" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="186" cy="81" r="5" fill="#10b981"/>
  <text x="400" y="86" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">kantinku.demo.stella.sch.id</text>

  <!-- Content Elements -->
  <!-- Top Banner inside card -->
  <rect x="150" y="125" width="500" height="90" rx="12" fill="url(#accentOrange)"/>
  <text x="180" y="165" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold">KantinKu - E-Canteen App</text>
  <text x="180" y="192" fill="#ffedd5" font-family="Segoe UI, sans-serif" font-size="13">Pesan makanan tanpa antre dengan transaksi digital</text>

  <!-- Product items mockup -->
  <rect x="150" y="235" width="150" height="175" rx="10" fill="#334155" opacity="0.8"/>
  <rect x="165" y="250" width="120" height="70" rx="6" fill="#475569"/>
  <rect x="165" y="335" width="90" height="10" rx="4" fill="#cbd5e1"/>
  <rect x="165" y="355" width="50" height="12" rx="4" fill="#fb923c"/>
  <rect x="165" y="375" width="120" height="22" rx="6" fill="#ea580c"/>

  <rect x="325" y="235" width="150" height="175" rx="10" fill="#334155" opacity="0.8"/>
