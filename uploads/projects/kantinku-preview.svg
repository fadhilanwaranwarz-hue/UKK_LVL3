  <rect x="500" y="235" width="150" height="175" rx="10" fill="#334155" opacity="0.8"/>
  <rect x="515" y="250" width="120" height="70" rx="6" fill="#475569"/>
  <rect x="515" y="335" width="100" height="10" rx="4" fill="#cbd5e1"/>
